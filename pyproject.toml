[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lnmap"
description = "Find and list sets of hard-linked files within a directory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
dynamic = ["version"]

[project.scripts]
lnmap = "lnmap.cli:main"

[tool.setuptools.dynamic]
version = {attr = "lnmap.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]